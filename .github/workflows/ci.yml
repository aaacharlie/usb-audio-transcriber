name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Python
        run: python -m py_compile bin/*.py
      - name: Check shell syntax
        run: bash -n install.sh uninstall.sh bootstrap.sh bin/run-cycle.sh
      - name: Run tests
        run: python -m unittest discover -s tests -v
